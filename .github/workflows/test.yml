name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3 mypy==2.4.1
      - name: ruff (lint)
        run: ruff check scripts tests
      - name: mypy (types)
        run: mypy
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install coverage==7.17.0
      - name: git identity for the test clones
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: run every test under coverage, subprocesses included
        run: |
          coverage run -m unittest
          coverage combine
          coverage report --fail-under=80
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: git identity for the test clones
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - run: python -m unittest -v
