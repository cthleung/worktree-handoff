[project]
name = "worktree-handoff"
version = "0.1.0"
description = "Carry uncommitted work between computers through a hidden git ref."
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, import order
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
